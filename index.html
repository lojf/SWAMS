<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>AMS P-Skive Kontrol</title>
    <script src="mqttws31.js" type="text/javascript"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
        }
        .box {
            background-color: white;
            padding: 30px;
            display: inline-block;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        input, button {
            padding: 10px;
            font-size: 16px;
            margin: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover { background-color: #0056b3; }
        .auto-btn { background-color: #28a745; } /* Grøn knap til Auto */
        .auto-btn:hover { background-color: #218838; }
        #status { font-weight: bold; color: red; }
        #liveClock { font-size: 20px; font-weight: bold; color: #333; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="box">
    <h2>AMS P-Skive Kontrol</h2>
    
    <!-- Live ur (Browserens RTC) -->
    <div id="liveClock">Henter tid...</div>
    
    <p>Forbindelsesstatus: <span id="status">Afbrudt</span></p>
    
    <label for="timeInput">Indstil tidspunkt manuelt:</label><br>
    <input type="time" id="timeInput" value="14:00"><br><br>
    
    <button onclick="sendTid()">Send manuel tid</button>
    <button class="auto-btn" onclick="parkerNu()">Parker nu (Auto +15m)</button>
    <br><br>
    <button onclick="add15Min()">+15 min</button>
    <button onclick="subtract15Min()">-15 min</button>
</div>

<script>
    // HiveMQ Cloud Websocket Configuration
    const mqttHost = "e485e36576474f2980cbef4972a4cd36.s1.eu.hivemq.cloud";
    const mqttPort = 8884; 
    const mqttPath = "/mqtt";
    const clientId = "web_client_" + Math.random().toString(36).substring(7);

    var client = new Paho.MQTT.Client(mqttHost, mqttPort, mqttPath, clientId);

    client.onConnectionLost = onConnectionLost;
    client.onMessageArrived = onMessageArrived;

    var options = {
        useSSL: true,
        userName: "pskive_bruger",
        password: "Lommetyv67",
        onSuccess: onConnect,
        onFailure: onFailure
    };

    client.connect(options);

    // --- RTC & LIVE UR FUNKTIONER ---
    
    // Opdaterer uret på skærmen hvert sekund
    setInterval(function() {
        let nu = new Date();
        let h = nu.getHours();
        let m = nu.getMinutes();
        let s = nu.getSeconds();
        let tidString = (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
        document.getElementById("liveClock").innerText = "Aktuel tid: " + tidString;
    }, 1000);

    // "Parker nu" funktion - bruger browserens RTC til at finde tid og runde op
    function parkerNu() {
        let nu = new Date();
        let h = nu.getHours();
        let m = nu.getMinutes();

        // Danske regler: Rund op til nærmeste kvarter
        // Vi lægger 1 minut til for at sikre, at vi altid runder OP (f.eks. 14:15 bliver til 14:30)
        let afrundetMinutter = Math.ceil((m + 1) / 15) * 15;
        
        if (afrundetMinutter >= 60) {
            h = (h + 1) % 24;
            afrundetMinutter = 0;
        }

        let nyTid = (h < 10 ? "0" : "") + h + ":" + (afrundetMinutter < 10 ? "0" : "") + afrundetMinutter;
        
        // Opdater input feltet så brugeren kan se hvad der blev sendt
        document.getElementById("timeInput").value = nyTid;
        
        // Send beskeden med det samme
        let message = new Paho.MQTT.Message(nyTid);
        message.destinationName = "AU_AMS_PSKIVE/pskive/set_time";
        client.send(message);
        alert("Automatisk parkering indstillet til: " + nyTid);
    }

    // --- MQTT STANDARD FUNKTIONER ---

    function onConnect() {
        document.getElementById("status").innerText = "Forbundet";
        document.getElementById("status").style.color = "green";
    }

    function onFailure(message) {
        document.getElementById("status").innerText = "Fejl";
    }

    function onConnectionLost(responseObject) {
        if (responseObject.errorCode !== 0) {
            document.getElementById("status").innerText = "Afbrudt";
            document.getElementById("status").style.color = "red";
        }
    }

    function sendTid() {
        let tid = document.getElementById("timeInput").value;
        let message = new Paho.MQTT.Message(tid);
        message.destinationName = "AU_AMS_PSKIVE/pskive/set_time";
        client.send(message);
        alert("Tid sendt til P-skiven: " + tid);
    }

    function add15Min() {
        let timeInput = document.getElementById("timeInput").value;
        let parts = timeInput.split(":");
        let h = parseInt(parts[0]);
        let m = parseInt(parts[1]);
        m += 15;
        if (m >= 60) { h = (h + 1) % 24; m -= 60; }
        let nyTid = (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
        document.getElementById("timeInput").value = nyTid;
        let message = new Paho.MQTT.Message(nyTid);
        message.destinationName = "AU_AMS_PSKIVE/pskive/set_time";
        client.send(message);
    }

    function subtract15Min() {
        let timeInput = document.getElementById("timeInput").value;
        let parts = timeInput.split(":");
        let h = parseInt(parts[0]);
        let m = parseInt(parts[1]);
        m -= 15;
        if (m < 0) { h = (h - 1 + 24) % 24; m += 60; }
        let nyTid = (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
        document.getElementById("timeInput").value = nyTid;
        let message = new Paho.MQTT.Message(nyTid);
        message.destinationName = "AU_AMS_PSKIVE/pskive/set_time";
        client.send(message);
    }

    function onMessageArrived(message) {
        console.log("Modtaget: " + message.payloadString);

        if(message.destinationName === "AU_AMS_PSKIVE/pskive/request_time" && message.payloadString === "REQUEST") {
            parkerNu(); // Kald parkerNu() når vi modtager en REQUEST
        }
    }
</script>

</body>
</html>
