<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P-Skive Kontrolpanel</title>
    <script src="paho-mqtt.js" type="text/javascript"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
            width: 120px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        input {
            padding: 12px;
            font-size: 16px;
            width: 70%;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            margin-top: 10px;
        }
        .status {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>P-Skive Kontrolpanel</h1>
        
        <button onclick="publishMessage('+15')">+15 min</button>
        <button onclick="publishMessage('+30')">+30 min</button>
        <button onclick="publishMessage('+60')">+60 min</button>
        
        <br>
        
        <input type="text" id="customPayload" placeholder="Eks. +45 eller 14:30">
        <button onclick="publishCustom()" style="background-color: #28a745; width: auto; padding: 12px 15px;">Send</button>

        <div class="status" id="statusText">Forbinder til HiveMQ...</div>
    </div>

    <script>
        // HiveMQ Cloud WebSockets forbindelsesdetaljer
        const host = "e485e36576474f2980cbef4972a4cd36.s1.eu.hivemq.cloud";
        const port = 8884; // Standard WebSocket-port med SSL
        const clientId = "web_control_" + Math.random().toString(16).slice(2, 8);
        
        // Opret MQTT-klient instans
        const client = new Paho.MQTT.Client(host, port, "/mqtt", clientId);

        // Håndter forbindelseshændelser
        client.onConnectionLost = onConnectionLost;
        // Vi behøver ikke modtage beskeder her, da den bare skal sende til ESP32'eren.

        const options = {
            useSSL: true,
            userName: "pskive_bruger",
            password: "Lommetyv67",
            onSuccess: onConnect,
            onFailure: onFailure
        };

        // Forbind
        client.connect(options);

        function onConnect() {
            document.getElementById("statusText").innerText = "Forbundet til skyen! (Klar)";
        }

        function onFailure(responseObject) {
            document.getElementById("statusText").innerText = "Forbindelse fejlede: " + responseObject.errorMessage;
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                document.getElementById("statusText").innerText = "Forbindelse mistet: " + responseObject.errorMessage;
            }
        }

        function publishMessage(payloadStr) {
            if (client.isConnected()) {
                const message = new Paho.MQTT.Message(payloadStr);
                message.destinationName = "AU_AMS_PSKIVE/pskive/set_time";
                
                // Send beskeden
                client.send(message);
                document.getElementById("statusText").innerText = "Sendte: " + payloadStr;
            } else {
                document.getElementById("statusText").innerText = "Fejl: Ikke forbundet!";
            }
        }

        function publishCustom() {
            const customVal = document.getElementById("customPayload").value;
            if (customVal) {
                publishMessage(customVal);
            }
        }
    </script>
</body>
</html>
